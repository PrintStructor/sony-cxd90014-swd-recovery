# Sony A5000 – SWD Stufe 2h: PC von Kern 0 beim Einschalten aufzeichnen (NUR LESEN)
# Fragt 40 s lang so schnell wie möglich DBGPCSR (0x80110084) ab und schreibt jede
# Änderung des Adressbereichs mit Zeitstempel. Ohne Pause nach einem Verbindungsfehler,
# damit sichtbar wird, wie früh nach dem Einschalten der Debug-Port antwortet.
# Kein Halt, kein Schreiben.
adapter driver cmsis-dap
adapter speed 1000
transport select swd
reset_config none
swd newdap cxd90014 cpu -enable
dap create cxd90014.dap -chain-position cxd90014.cpu
target create cxd90014.apb mem_ap -dap cxd90014.dap -ap-num 1
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
targets cxd90014.apb
set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
set f [open logs/pcstart_$stempel.txt w]
set t0 [clock milliseconds]
set letzt ""
set n 0
proc bereich {pc} {
    if {$pc >= 0xc01f0000 && $pc < 0xc0211000} { return [format "L3 %08x" $pc] }
    if {$pc >= 0xc0030000 && $pc < 0xc01f0000} { return [format "L2 %08x" $pc] }
    if {$pc >= 0xffff0000} { return [format "ROM %08x" $pc] }
    if {$pc >= 0x40000000 && $pc < 0x80000000} { return "Kernel" }
    return [format "anders %08x" $pc]
}
while {[clock milliseconds] - $t0 < 40000} {
    if {[catch {set pc [lindex [cxd90014.apb read_memory 0x80110084 32 1] 0]} err]} {
        set z "keine Verbindung"
        catch {dap init}
    } else {
        set z [bereich $pc]
        incr n
    }
    set kurz [lindex $z 0]
    if {$kurz ne $letzt || [string match "L3*" $z]} {
        set zeile [format "%6d ms  %s" [expr {[clock milliseconds] - $t0}] $z]
        puts $f $zeile
        if {$kurz ne $letzt} { echo $zeile }
        set letzt $kurz
    }
}
close $f
echo "Ende: $n Lesungen, Datei logs/pcstart_$stempel.txt"
shutdown
