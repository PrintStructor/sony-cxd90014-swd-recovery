# =====================================================================
# Sony A5000 (CXD90014) – SWD Stufe 2c: persistente Logpuffer (NUR LESEN)
# Adressen aus der A5000-eigenen /setting/kemco.txt (Kernel-Kommandozeile,
# byte-gleich in Original-v1.10, Mod-v1.11 und Spender):
#   klog.addr=0x834E0000 klog.size=0x20000   (Kopf "klog" + Länge)
#   alog.addr=0x8345ffc0 alog.size=0x60040   (log_main 256K + log_events
#     128K, je mit 32-Byte-Trailer; gleiche Aufteilung wie α7R II)
#   boottime=0x20000@0x834C0000              (zusätzlich, unbekanntes Format)
# klog übersteht Warmstarts ("keep logging buffer"), bei der α7R II
# stand dort jeder Bootschleifen-Zyklus.
# Kein Halt, kein Schreiben. 100 kHz, bis die Lötverbindung erprobt ist;
# danach kann "adapter speed 1000" verwendet werden.
# =====================================================================
adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none
swd newdap cxd90014 cpu -enable
dap create cxd90014.dap -chain-position cxd90014.cpu
target create cxd90014.ahb mem_ap -dap cxd90014.dap -ap-num 0
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
targets cxd90014.ahb
set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
echo "klog-Kopf (erwartet 676f6c6b = \"klog\", dann Länge):"
catch {mdw 0x834e0000 8} r; echo $r
catch {dump_image logs/klog_$stempel.bin 0x834e0000 0x20000} r; echo $r
echo "alog log_main-Kopf:"
catch {mdw 0x8345ffc0 8} r; echo $r
catch {dump_image logs/alog_main_$stempel.bin 0x8345ffc0 0x40020} r; echo $r
echo "alog log_events:"
catch {dump_image logs/alog_events_$stempel.bin 0x8349ffe0 0x20020} r; echo $r
echo "boottime-Kopf:"
catch {mdw 0x834c0000 8} r; echo $r
catch {dump_image logs/boottime_$stempel.bin 0x834c0000 0x20000} r; echo $r
shutdown
