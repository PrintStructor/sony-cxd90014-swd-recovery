# =====================================================================
# Sony A5000 (CXD90014) – SWD Stufe 2d: klog in der BOOTSCHLEIFE lesen
# NUR LESEN. Kein Halt, kein Schreiben in Speicher oder CPU.
#
# Zweck: die WBI1/LZPT-Hypothese live prüfen. Erwartet wird, dass jeder
# Zyklus mit einem Warmstart aus dem Snapshot beginnt und danach beim
# Zugriff auf /usr (nflasha15, LZPT) oder in einem Prozess abbricht.
#
# Die Schleife liest 45 s lang immer wieder den klog-Kopf (0x834e0000,
# aus kemco.txt der A5000) und speichert jeweils den beschriebenen Teil.
# Bricht die Verbindung beim Neustart ab, wird der DAP neu initialisiert.
# Von jedem Zyklus bleibt so der längste Stand, also die letzten
# Meldungen kurz vor dem Neustart.
# Zusätzlich: Trailer von log_main/log_events (je 32 Byte).
# 100 kHz: Ein Durchlauf mit voller klog-Länge braucht dann ~3 s. Erst
# wenn Stufe 2c bei 1000 kHz bitgleich zu 100 kHz ist, hier auf 1000.
# =====================================================================
adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none
swd newdap cxd90014 cpu -enable
dap create cxd90014.dap -chain-position cxd90014.cpu
target create cxd90014.ahb mem_ap -dap cxd90014.dap -ap-num 0
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
targets cxd90014.ahb

set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
file mkdir logs/schleife_$stempel
set t0 [clock milliseconds]
set i 0
set fehler 0
while {[clock milliseconds] - $t0 < 45000} {
    incr i
    set t [expr {[clock milliseconds] - $t0}]
    if {[catch {
        set kopf [cxd90014.ahb read_memory 0x834e0000 32 2]
        set magic [lindex $kopf 0]
        set len   [expr {[lindex $kopf 1]}]
        if {$magic == 0x676f6c6b && $len > 0 && $len <= 0x1fff8} {
            set n [expr {($len + 8 + 3) & ~3}]
            dump_image [format "logs/schleife_%s/klog_%04d_t%05d_len%06d.bin" $stempel $i $t $len] 0x834e0000 $n
            echo [format "%6d ms  #%d  klog len %d" $t $i $len]
        } else {
            echo [format "%6d ms  #%d  klog-Kopf ungültig: %08x %08x" $t $i $magic $len]
        }
        set tr1 [cxd90014.ahb read_memory 0x8349ffc0 32 8]
        set tr2 [cxd90014.ahb read_memory 0x834bffe0 32 8]
        set f [open logs/schleife_$stempel/alog_trailer.txt a]
        puts $f "$t $i main: $tr1 events: $tr2"
        close $f
    } err]} {
        incr fehler
        echo [format "%6d ms  #%d  Lesefehler: %s" $t $i $err]
        catch {dap init}
        sleep 200
    }
    sleep 150
}
echo [format "Fertig: %d Durchläufe, %d Lesefehler. Ordner logs/schleife_%s" $i $fehler $stempel]
shutdown
