# =====================================================================
# Sony A5000 (CXD90014) – SWD Stufe 2: nur lesender Speicherzugriff
# Erst ausführen, wenn Stufe 1 eine plausible DPIDR und AP0/AP1 zeigt.
#
# Liest über AP0 (AHB-AP, physischer Speicher) mit einem "mem_ap"-Target.
# Ein mem_ap-Target hat keine CPU-Steuerung: kein Halt, kein Schritt.
# Über AP1 (APB-AP) werden nur Kennungs- und Statusregister von Kern 0
# gelesen, keine Schreibzugriffe (kein Entsperren über DBGLAR).
#
# Ergebnisse landen in logs/ (Pfade relativ zum Startordner).
#
# Stand 15.11. (α7R-II-Probelauf): BootROM der α7R II ist byte-gleich
# zum A5000-Spender. In OpenOCD 0.12 verschluckt "catch {…}" die Ausgabe,
# deshalb überall "catch {…} r; echo $r". Im Werksmodus (56k) läuft
# Linux; der Loader3-Bereich im RAM kann dann schon überschrieben sein.
# Nach dem Lauf vergleicht start_stufe.sh die Prüfblöcke für Stufe 3.
# =====================================================================

adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none

swd newdap cxd90014 cpu -enable
dap create cxd90014.dap -chain-position cxd90014.cpu

target create cxd90014.ahb mem_ap -dap cxd90014.dap -ap-num 0
target create cxd90014.apb mem_ap -dap cxd90014.dap -ap-num 1

gdb_port disabled
tcl_port disabled
telnet_port disabled

init

# --- 1) Kern-0-Debugregister (nur lesen) ----------------------------
targets cxd90014.apb
echo "DBGDIDR  Kern 0 (0x80110000):"
catch {mdw 0x80110000} r; echo $r
echo "DBGDSCR  Kern 0 (0x80110088, externe Sicht, ohne Nebenwirkung):"
catch {mdw 0x80110088} r; echo $r
echo "MIDR/CPUID Kern 0 (0x80110d00, erwartet 0x410fc05x = Cortex-A5):"
catch {mdw 0x80110d00} r; echo $r
echo "PC-Stichproben Kern 0 (DBGPCSR 0x80110084), 8x:"
for {set i 0} {$i < 8} {incr i} { catch {mdw 0x80110084} r; echo $r ; sleep 50 }

# --- 2) BootROM lesen und mit dem Spender vergleichen ---------------
targets cxd90014.ahb
echo "BootROM-Kopf 0xffff0000:"
catch {mdw 0xffff0000 8} r; echo $r
catch {dump_image logs/bootrom_defekt.bin 0xffff0000 0x6000} r; echo $r

# --- 3) Loader3-Bereich (nur aussagekräftig, solange Loader3 läuft) --
# Erwartete Werte aus Spender-Loader3 (FW 1.10, sha256 e6f0fb2b…):
#   0xc01f0000: ea000008 ea000005 ea000004 ea000003 ...
#   0xc01f15b0: a1f8a2f5 f8a8f002 a0fae004 fff9f002 da012800 bd102000 bd102001 b50848dd
#   0xc01f1e10: fbc3f7ff 2003b108 f7ffe188 2405ffa6 ...
echo "Loader3 0xc01f0000:"
catch {mdw 0xc01f0000 8} r; echo $r
echo "Loader3 0xc01f15b0 (Updater-Prüfung):"
catch {mdw 0xc01f15b0 8} r; echo $r
echo "Loader3 0xc01f1e10 (BootMode-Auswahl):"
catch {mdw 0xc01f1e10 8} r; echo $r
catch {dump_image logs/loader3_ram_defekt.bin 0xc01f0000 0x21000} r; echo $r

shutdown
