# =====================================================================
# Sony A5000 (CXD90014) – SWD Stufe 2b: Kernel-Log aus dem RAM (NUR LESEN)
# Voraussetzung: Stufe 1 und 2 erfolgreich (DPIDR 0x3ba02477).
#
# Herleitung offline aus der A5000-FW 1.10 (nflasha3/vmlinux.bin,
# Linux 3.0.27_nl-rt106, 7. Okt. 2014), NICHT von der α7R II übernommen:
#   vmlinux.bin beginnt bei VA 0x40038000, Kopf: e321f0d3 eb0059e5
#   (α7R II: e321f0d3 eb005a0d, also anderer Build).
#   console_unlock (0x400609ac..) lädt:
#     0x4037c760 = log_buf_len (Startwert 0x2000), 0x4037c764 = log_buf
#     0x40395290 = log_end, +4 log_start, +8 con_start (+c logged_chars,
#     Lage wie bei der α7R II, hier nicht eigens geprüft)
# PHYS_OFFSET: kemco.txt der A5000 (identisch in Original-, Mod-Paket und
# Spender) hat mem=200M@0x80000000 und initrd=0x80428000 -> erwartet
# 0x80000000. Trotzdem werden Kandidaten nur GELESEN und am Kernel-Kopf
# geprüft. Lesefehler an Adressen ohne Speicher sind harmlos.
# Kein Halt, kein Schreiben in Speicher oder CPU-Register.
# AHB-AP liest am CPU-Cache vorbei: die jüngsten Zeilen können fehlen.
# =====================================================================

adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none

swd newdap cxd90014 cpu -enable
dap create cxd90014.dap -chain-position cxd90014.cpu
target create cxd90014.ahb mem_ap -dap cxd90014.dap -ap-num 0

gdb_port disabled
tcl_port disabled
telnet_port disabled

init
targets cxd90014.ahb

proc rd32 {a} {
    set v [cxd90014.ahb read_memory $a 32 1]
    return [expr {[lindex $v 0]}]
}

set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
set phys -1
foreach c {0x80000000 0x00000000 0x40000000 0x8c800000} {
    if {[catch {set w0 [rd32 [expr {$c + 0x38000}]]; set w1 [rd32 [expr {$c + 0x38004}]]} err]} {
        echo [format "PHYS-Kandidat 0x%08x: Lesefehler (%s)" $c $err]
        continue
    }
    echo [format "PHYS-Kandidat 0x%08x: %08x %08x" $c $w0 $w1]
    if {$w0 == 0xe321f0d3 && $w1 == 0xeb0059e5} { set phys $c; break }
}

if {$phys < 0} {
    echo "A5000-Kernel-Kopf an keinem Kandidaten gefunden. Nichts weiter gelesen."
} else {
    echo [format ">>> Kernel gefunden: PHYS_OFFSET = 0x%08x" $phys]
    proc v2p {va} { global phys; return [expr {$va - 0x40000000 + $phys}] }
    set len  [rd32 [v2p 0x4037c760]]
    set buf  [rd32 [v2p 0x4037c764]]
    set lend [rd32 [v2p 0x40395290]]
    set lsta [rd32 [v2p 0x40395294]]
    set csta [rd32 [v2p 0x40395298]]
    set lchr [rd32 [v2p 0x4039529c]]
    echo [format "log_buf_len 0x%x  log_buf 0x%08x  log_end %u  log_start %u  con_start %u  logged_chars %u" $len $buf $lend $lsta $csta $lchr]
    set f [open "logs/kernel_log_meta_$stempel.txt" w]
    puts $f [format "phys 0x%08x\nlen 0x%x\nbuf 0x%08x\nlog_end %u\nlog_start %u\ncon_start %u\nlogged_chars %u" $phys $len $buf $lend $lsta $csta $lchr]
    close $f
    if {$len > 0 && $len <= 0x100000 && $buf >= 0x40000000 && $buf < 0x80000000} {
        catch {dump_image logs/kernel_log_$stempel.bin [v2p $buf] $len} r; echo $r
    } else {
        echo "log_buf-Werte unplausibel, kein Dump."
    }
}
shutdown
