# =====================================================================
# Sony A5000 (CXD90014) – SWD Stufe 2g: Stufe 2 robust (NUR LESEN)
# Für eine Kamera, die sich immer wieder abschaltet oder neu startet.
# Liest 90 s lang in kleinen Stücken mit Wiederholung:
#   - PC-Stichprobe Kern 0 (DBGPCSR) bei jedem Versuch -> logs/2g_<stempel>/pc.txt
#   - die 4 Loader3-Prüfblöcke für Stufe 3 (56 Worte, Bruchteil einer Sekunde)
#     -> logs/2g_<stempel>/block_<adr>.txt, sobald ein Block vollständig gelesen ist
#   - BootROM 0xffff0000 in 24 Stücken zu 1 KB -> logs/2g_<stempel>/bootrom_NN.bin
# Kein Halt, kein Schreiben in Speicher oder CPU-Register.
# =====================================================================
adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none
swd newdap cxd90014 cpu -enable
dap create cxd90014.dap -chain-position cxd90014.cpu
target create cxd90014.ahb mem_ap -dap cxd90014.dap -ap-num 0
target create cxd90014.apb mem_ap -dap cxd90014.dap -ap-num 1
gdb_port disabled
tcl_port disabled
telnet_port disabled
init

set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
set ordner logs/2g_$stempel
file mkdir $ordner
set blocks {{0xc01f0000 8} {0xc01f1590 16} {0xc01f1de0 20} {0xc01f1360 12}}
set fertig_block [dict create]
set fertig_rom [dict create]
set t0 [clock milliseconds]
set fehler 0
while {[clock milliseconds] - $t0 < 90000} {
    set t [expr {[clock milliseconds] - $t0}]
    if {[catch {
        set pc [lindex [cxd90014.apb read_memory 0x80110084 32 1] 0]
        set f [open $ordner/pc.txt a]; puts $f [format "%6d %08x" $t $pc]; close $f
        foreach b $blocks {
            set a [lindex $b 0]
            if {[dict exists $fertig_block $a]} continue
            set w [cxd90014.ahb read_memory $a 32 [lindex $b 1]]
            set f [open [format "%s/block_%08x.txt" $ordner $a] w]
            puts $f [format "%6d ms PC %08x" $t $pc]
            set z ""
            foreach x $w { append z [format "%08x " $x] }
            puts $f $z
            close $f
            dict set fertig_block $a 1
            echo [format "%6d ms  Block 0x%08x gelesen (PC %08x)" $t $a $pc]
        }
        for {set k 0} {$k < 24} {incr k} {
            if {[dict exists $fertig_rom $k]} continue
            dump_image [format "%s/bootrom_%02d.bin" $ordner $k] [expr {0xffff0000 + $k * 0x400}] 0x400
            dict set fertig_rom $k 1
        }
    } err]} {
        incr fehler
        catch {dap init}
        sleep 100
    }
    if {[dict size $fertig_block] == 4 && [dict size $fertig_rom] == 24} { break }
    sleep 50
}
echo [format "Fertig nach %d ms: %d/4 Prüfblöcke, %d/24 BootROM-Stücke, %d Lesefehler. Ordner %s" \
    [expr {[clock milliseconds] - $t0}] [dict size $fertig_block] [dict size $fertig_rom] $fehler $ordner]
shutdown
