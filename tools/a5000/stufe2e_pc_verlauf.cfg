# Sony A5000 (CXD90014) – SWD Stufe 2e: PC-Verlauf aller 4 Kerne (NUR LESEN)
# Liest 15 s lang alle ~100 ms DBGPCSR (Debugbasis+0x084) und DBGDSCR (+0x088)
# der Kerne 0..3 über AP1. Kein Halt, kein Schreiben (kein DBGLAR-Entsperren).
# Debugbasen 0x80110000/2000/4000/6000 wie A6000 und α7R II; vorher in der
# ROM-Tabelle aus Stufe 1 bestätigen.
# Nützlich, um Zykluslänge der Bootschleife und Loader3-Phase (PC in
# 0xc01f0000..0xc0211000) zu sehen, bevor Stufe 3 läuft.
adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none
swd newdap cxd90014 cpu -enable
dap create cxd90014.dap -chain-position cxd90014.cpu
target create cxd90014.apb mem_ap -dap cxd90014.dap -ap-num 1
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
targets cxd90014.apb
set t0 [clock milliseconds]
set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
set f [open logs/pcverlauf_$stempel.txt w]
while {[clock milliseconds] - $t0 < 15000} {
    set t [expr {[clock milliseconds] - $t0}]
    set z [format "%6d" $t]
    foreach b {0x80110000 0x80112000 0x80114000 0x80116000} {
        if {[catch {
            set pc [lindex [cxd90014.apb read_memory [expr {$b + 0x84}] 32 1] 0]
            set ds [lindex [cxd90014.apb read_memory [expr {$b + 0x88}] 32 1] 0]
            append z [format "  %08x/%08x" $pc $ds]
        } err]} {
            append z "  --------/--------"
            catch {dap init}
        }
    }
    puts $f $z
    echo $z
    sleep 80
}
close $f
shutdown
