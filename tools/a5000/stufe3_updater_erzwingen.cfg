# =====================================================================
# Sony A5000 (CXD90014) – SWD Stufe 3: Updater-Modus erzwingen
# !!! SCHREIBEND (nur CPU-Register r0, nichts Dauerhaftes) – NUR NACH FREIGABE !!!
# Voraussetzungen: Stufe 1, 2 und 2c/2d gelaufen, Prüfblock-Vergleich
# aus Stufe 2 (start_stufe.sh) ohne Abweichung, ausdrückliche Freigabe.
#
# Aufbau übernommen vom α7R-II-Lauf am 15.11. (dort erfolgreich), alle
# Adressen und Sollwerte aber aus dem A5000-Spender-Loader3
# (boot5, FW 1.10, sha256 e6f0fb2b…), offline disassembliert:
#   chk_updater         0xc01f159a  (prüft "\updater\mode", 8 Aufrufer)
#   cmp r0,#0           0xc01f15c0  r0 >= 0 -> "Datei da" -> return 1
#   BootMode-Auswahl    0xc01f1de6, ruft chk_updater bei 0xc01f1e10,
#                       cbz r0 / movs r0,#3 bei 0xc01f1e16
#   Updater-Lader       0xc01f1378
# Abweichung zur α7R II: kein set_bootmode-Übersteuern. Bei der α7R II
# war es unnötig (die Dateiprüfung allein ergab Modus 3), und für die
# A5000 ist es nicht analysiert. 0xc01f1e16 dient nur der Kontrolle.
#
# Ablauf (Bootschleife, USB-Kabel am Mac):
#  1. DBGPCSR von Kern 0 laufend abfragen. Steht der PC im Loader3
#     (0xc01f0000..0xc0211000): Kern 0 anhalten.
#  2. Im Halt 4 Codeblöcke mit dem Spender vergleichen. Bei JEDER
#     Abweichung: keine Breakpoints, weiterlaufen lassen, Abbruch.
#  3. Hardware-Breakpoints (Cortex-A5 hat genau 3):
#       0xc01f15c0  r0 := 0, zurücklesen, Einzelschritt, neu setzen
#       0xc01f1e16  nur Protokoll: BootMode 3 gewählt
#       0xc01f1378  Updater-Lader erreicht -> ERFOLG
#  4. Nach Erfolg alle Breakpoints entfernen, weiterlaufen lassen.
#     Erwartet: USB 054c:03e2 am Mac.
# Verpasster Zyklus -> neuer Versuch beim nächsten Neustart (max. 150 s).
# 100 kHz (19.11.): bei gelöteten Drähten erprobt, Loader3-Phase dauert ~2 s,
# das reicht für Abfrage, Halt und Codevergleich. 1000 kHz ist ungetestet.
# =====================================================================
adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none
swd newdap cxd90014 cpu -enable
dap create cxd90014.dap -chain-position cxd90014.cpu
target create cxd90014.ahb mem_ap -dap cxd90014.dap -ap-num 0
target create cxd90014.apb mem_ap -dap cxd90014.dap -ap-num 1
target create cxd90014.cpu0 cortex_a -dap cxd90014.dap -ap-num 1 -dbgbase 0x80110000 -defer-examine
gdb_port disabled
tcl_port disabled
telnet_port disabled
init

set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
set logf [open logs/stufe3_ablauf_$stempel.txt w]
proc log {s} {
    global logf t0
    set z [format "%7d ms  %s" [expr {[clock milliseconds] - $t0}] $s]
    echo $z; puts $logf $z; flush $logf
}
proc rd32 {tgt a} { return [expr {[lindex [$tgt read_memory $a 32 1] 0]}] }
proc rdn {a n} { return [cxd90014.ahb read_memory $a 32 $n] }
proc reg32 {name} {
    set r [reg $name]
    return [expr {[lindex [split $r ":"] end]}]
}

# Sollwerte aus Spender-Loader3.bin (Basis 0xc01f0000)
set erwartet {
    {0xc01f0000 {0xea000008 0xea000005 0xea000004 0xea000003 0xea000002 0xea000001 0xea000000 0xeaffffff}}
    {0xc01f1590 {0xf8baf002 0x2000bd0e 0x20054770 0xb510a1f5 0xf8b2f002 0xf0022002 0x0003fcfc 0x2003d005 0xa1f8a2f5 0xf8a8f002 0xa0fae004 0xfff9f002 0xda012800 0xbd102000 0xbd102001 0xb50848dd}}
    {0xc01f1de0 {0x2001bd1c 0xb5febd1c 0x25012600 0x5600e9cd 0xfa30f003 0xd1032802 0xfbcff7ff 0xd0752800 0xa901483c 0xf0023808 0x2800fe37 0x9601da00 0xfbc3f7ff 0x2003b108 0xf7ffe188 0x2405ffa6 0xd1642800 0xff24f7ff 0xd1fa2800 0xa9024831}}
    {0xc01f1360 {0xf7ff6820 0x2000f915 0xf6afbd10 0x2003318c 0xf9caf002 0xbd10485b 0xf004b510 0xf2afff4e 0x2002516c 0xf9c0f002 0xf0042003 0xf004fc32}}
}

proc pruefe_code {} {
    global erwartet
    foreach blk $erwartet {
        set a [lindex $blk 0]; set soll [lindex $blk 1]
        set ist [rdn $a [llength $soll]]
        for {set i 0} {$i < [llength $soll]} {incr i} {
            if {[expr {[lindex $ist $i]}] != [expr {[lindex $soll $i]}]} {
                log [format "ABWEICHUNG bei 0x%08x: ist %08x, soll %08x" [expr {$a + 4*$i}] [lindex $ist $i] [lindex $soll $i]]
                return 0
            }
        }
    }
    return 1
}

proc alle_bp_weg {} {
    foreach a {0xc01f15c0 0xc01f1e16 0xc01f1378} { catch {rbp $a} }
}

set t0 [clock milliseconds]
set erfolg 0
set abbruch 0
set examiniert 0
log "Stufe 3 (A5000) gestartet. Warte auf Kern 0 im Loader3 ..."

while {!$erfolg && !$abbruch && [clock milliseconds] - $t0 < 150000} {
    # 1) PC abfragen (nur lesen)
    if {[catch {set pc [rd32 cxd90014.apb 0x80110084]} err]} {
        catch {dap init}; sleep 20; continue
    }
    if {$pc < 0xc01f0000 || $pc >= 0xc0211000} { continue }

    # 2) Anhalten
    log [format "Kern 0 im Loader3 (PCSR %08x) -> anhalten" $pc]
    if {[catch {
        if {!$examiniert} { cxd90014.cpu0 arp_examine; set examiniert 1 }
        targets cxd90014.cpu0
        halt 500
    } err]} { log "Anhalten fehlgeschlagen: $err"; set examiniert 0; catch {dap init}; continue }
    set hpc [reg32 pc]
    log [format "Angehalten bei pc %08x" $hpc]

    # 3) Code-Abgleich mit dem Spender
    if {![pruefe_code]} {
        log "Code weicht vom Spender ab -> ABBRUCH, Kern läuft unverändert weiter."
        alle_bp_weg; catch {resume}; set abbruch 1; break
    }
    log "Code-Abgleich OK (4 Blöcke identisch mit Spender-Loader3)."

    # 4) Breakpoints setzen und Treffer behandeln
    alle_bp_weg
    bp 0xc01f15c0 2 hw
    bp 0xc01f1e16 2 hw
    bp 0xc01f1378 2 hw
    resume
    while {1} {
        if {[catch {wait_halt 4000} err]} {
            log "Kein Treffer innerhalb 4 s (Zyklus verpasst?) -> neuer Versuch beim nächsten Start."
            catch {halt 500}; alle_bp_weg; catch {resume}; break
        }
        set p [reg32 pc]
        if {$p == 0xc01f15c0} {
            set r0 [reg32 r0]
            reg r0 0
            log [format "Treffer chk_updater: r0 %08x -> 00000000 (zurückgelesen %08x)" $r0 [reg32 r0]]
            rbp 0xc01f15c0; step; bp 0xc01f15c0 2 hw; resume
        } elseif {$p == 0xc01f1e16} {
            log "Treffer 0xc01f1e16: BootMode 3 (Updater) gewählt."
            rbp 0xc01f1e16; resume
        } elseif {$p == 0xc01f1378} {
            log "Treffer Updater-Lader 0xc01f1378 -> ERFOLG. Breakpoints entfernen, Kamera läuft weiter."
            alle_bp_weg; resume; set erfolg 1; break
        } else {
            log [format "Unerwarteter Halt bei %08x -> Breakpoints weg, weiter." $p]
            alle_bp_weg; resume; break
        }
    }
}
if {!$erfolg && !$abbruch} { log "Zeit abgelaufen ohne Erfolg." }
catch {alle_bp_weg}
log [format "Ende: Erfolg=%d Abbruch=%d" $erfolg $abbruch]
close $logf
shutdown
