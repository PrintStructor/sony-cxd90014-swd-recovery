# =====================================================================
# Sony A7R II – SWD Stufe 3: Updater-Modus erzwingen
# !!! SCHREIBEND (nur CPU-Register, nichts Dauerhaftes) – NUR NACH FREIGABE !!!
#
# Ablauf (Normalmodus / Bootschleife, USB-Kabel am Mac):
#  1. PC von Kern 0 laufend abfragen. Sobald er im Loader3 (0xc01f0000..
#     0xc0211000) steht: Kern anhalten.
#  2. Im Halt den Loader3-Code im RAM mit dem Dump vom 14.11. vergleichen
#     (5 Blöcke). Bei JEDER Abweichung: Breakpoints weg, weiterlaufen, Abbruch.
#  3. Hardware-Breakpoints:
#       0xc01f15a2  cmp r0,#0 nach "\updater\mode"-Prüfung -> r0 := 0
#                   (Datei gilt als vorhanden, chk_updater liefert 1)
#       0xc01f152c  set_bootmode-Eingang; nur beim Aufruf aus 0xc01f1732
#                   (lr = 0xc01f1737) -> r0 := 3 ("updater")
#       0xc01f1362  Updater-Lader (nur Kontrolle: Erfolg)
#  4. Nach Treffer des Updater-Laders: alle Breakpoints entfernen, weiter.
#     Erwartet: USB 054c:03e2 am Mac.
# Wird set_bootmode in einem Zyklus verpasst, wird beim nächsten Neustart
# der Schleife erneut versucht (max. 150 s).
# Verändert werden ausschließlich r0 (und kurzzeitig Debug-Breakpoints).
# =====================================================================
adapter driver cmsis-dap
adapter speed 1000
transport select swd
reset_config none
swd newdap a7rm2 cpu -enable
dap create a7rm2.dap -chain-position a7rm2.cpu
target create a7rm2.ahb mem_ap -dap a7rm2.dap -ap-num 0
target create a7rm2.apb mem_ap -dap a7rm2.dap -ap-num 1
target create a7rm2.cpu0 cortex_a -dap a7rm2.dap -ap-num 1 -dbgbase 0x80110000 -defer-examine
gdb_port disabled
tcl_port disabled
telnet_port disabled
init

set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
set logf [open logs/stufe3_ablauf_$stempel.txt w]
proc log {s} {
    global logf t0
    set z [format "%7d ms  %s" [expr {[clock milliseconds] - $t0}] $s]
    echo $z; puts $logf $z; flush $logf
}
proc rd32 {tgt a} { return [expr {[lindex [$tgt read_memory $a 32 1] 0]}] }
proc rdn {a n} { return [a7rm2.ahb read_memory $a 32 $n] }
proc reg32 {name} {
    set r [reg $name]
    return [expr {[lindex [split $r ":"] end]}]
}

set erwartet {
    {0xc01f0000 {0xea000008 0xea000005 0xea000004 0xea000003 0xea000002 0xea000001 0xea000000 0xeaffffff}}
    {0xc01f1520 {0x0a647274 0x00000000 0xc00e0000 0xb082b501 0x200049fc 0xf88daa02 0x20510000 0xf8d6f003 0x980249f9 0x60081d0a 0x49f62051 0xf0033128 0xf004f8cd 0x49f3fbba 0xf88d466a 0x20510000 0xf0033127 0x9a02f8c3 0x48f0a1f1 0x03c2eb00}}
    {0xc01f1580 {0xbd0efe19 0xb5102002 0xfa9bf002 0xd0050003 0xa2f22003 0xf001a1f4 0xe004fe0d 0xf002a0f6 0x2800fd98 0x2000da01 0x2001bd10 0xb570bd10}}
    {0xc01f16f0 {0xbdfe9802 0x2001b538 0xf0039000 0x2802fb7f 0xf7ffd102 0xb110ff3f 0xffa9f7ff 0xf7ff9000 0xb968ff39 0x46682201 0xf0032104 0x0004fbef 0xa1acd006 0x20034602 0xfd44f001 0xbd384620 0xf7ff9800 0x2000fefb 0x487bbd38 0x47706800}}
    {0xc01f1360 {0xb510bd10 0xfd65f004 0x5144f2af 0xf0012002 0x2003ff21 0xfa40f004 0xfbe5f004 0x31e8f2af}}
}

proc pruefe_code {} {
    global erwartet
    foreach blk $erwartet {
        set a [lindex $blk 0]; set soll [lindex $blk 1]
        set ist [rdn $a [llength $soll]]
        for {set i 0} {$i < [llength $soll]} {incr i} {
            if {[expr {[lindex $ist $i]}] != [expr {[lindex $soll $i]}]} {
                log [format "ABWEICHUNG bei 0x%08x: ist %08x, soll %08x" [expr {$a + 4*$i}] [lindex $ist $i] [lindex $soll $i]]
                return 0
            }
        }
    }
    return 1
}

proc alle_bp_weg {} {
    foreach a {0xc01f15a2 0xc01f152c 0xc01f1362} { catch {rbp $a} }
}

set t0 [clock milliseconds]
set erfolg 0
set abbruch 0
set examiniert 0
log "Stufe 3 gestartet. Warte auf Kern 0 im Loader3 ..."

while {!$erfolg && !$abbruch && [clock milliseconds] - $t0 < 150000} {
    # 1) PC abfragen
    if {[catch {set pc [rd32 a7rm2.apb 0x80110084]} err]} {
        catch {dap init}; sleep 20; continue
    }
    if {$pc < 0xc01f0000 || $pc >= 0xc0211000} { continue }

    # 2) Anhalten
    log [format "Kern 0 im Loader3 (PCSR %08x) -> anhalten" $pc]
    if {[catch {
        if {!$examiniert} { a7rm2.cpu0 arp_examine; set examiniert 1 }
        targets a7rm2.cpu0
        halt 500
    } err]} { log "Anhalten fehlgeschlagen: $err"; set examiniert 0; catch {dap init}; continue }
    set hpc [reg32 pc]
    log [format "Angehalten bei pc %08x" $hpc]

    # 3) Code-Abgleich
    if {![pruefe_code]} {
        log "Code weicht vom Dump ab -> ABBRUCH, Kern läuft unverändert weiter."
        alle_bp_weg; catch {resume}; set abbruch 1; break
    }
    log "Code-Abgleich OK (5 Blöcke identisch mit Dump vom 14.11.)."

    # 4) Breakpoints setzen und Treffer behandeln
    alle_bp_weg
    bp 0xc01f15a2 2 hw
    bp 0xc01f152c 2 hw
    bp 0xc01f1362 2 hw
    resume
    set modus_gesetzt 0
    while {1} {
        if {[catch {wait_halt 4000} err]} {
            log "Kein Treffer innerhalb 4 s (Zyklus verpasst?) -> neuer Versuch beim nächsten Start."
            catch {halt 500}; alle_bp_weg; catch {resume}; break
        }
        set p [reg32 pc]
        if {$p == 0xc01f15a2} {
            set r0 [reg32 r0]
            reg r0 0
            log [format "Treffer chk_updater: r0 %08x -> 00000000 (zurückgelesen %08x)" $r0 [reg32 r0]]
            rbp 0xc01f15a2; step; bp 0xc01f15a2 2 hw; resume
        } elseif {$p == 0xc01f152c} {
            set r0 [reg32 r0]; set lr [reg32 lr_svc]
            if {$lr == 0xc01f1737} {
                reg r0 3
                set modus_gesetzt 1
                log [format "Treffer set_bootmode aus BOM (lr %08x): Modus %d -> 3 (zurückgelesen %d)" $lr $r0 [reg32 r0]]
            } else {
                log [format "Treffer set_bootmode von lr %08x mit Modus %d -> unverändert" $lr $r0]
            }
            rbp 0xc01f152c; step; bp 0xc01f152c 2 hw; resume
        } elseif {$p == 0xc01f1362} {
            log "Treffer Updater-Lader 0xc01f1362 -> ERFOLG. Breakpoints entfernen, Kamera läuft weiter."
            alle_bp_weg; resume; set erfolg 1; break
        } else {
            log [format "Unerwarteter Halt bei %08x -> Breakpoints weg, weiter." $p]
            alle_bp_weg; resume; break
        }
    }
}
if {!$erfolg && !$abbruch} { log "Zeit abgelaufen ohne Erfolg." }
catch {alle_bp_weg}
log [format "Ende: Erfolg=%d Abbruch=%d" $erfolg $abbruch]
close $logf
shutdown
