# Sony A7R II – SWD Stufe 2e: PC-Verlauf aller 4 Kerne (NUR LESEN, APB-AP)
# Liest 15 s lang alle ~100 ms DBGPCSR (Debugbasis+0x084) und DBGDSCR (+0x088)
# der Kerne 0..3. Kein Halt, kein Schreiben (kein DBGLAR-Entsperren).
adapter driver cmsis-dap
adapter speed 1000
transport select swd
reset_config none
swd newdap a7rm2 cpu -enable
dap create a7rm2.dap -chain-position a7rm2.cpu
target create a7rm2.apb mem_ap -dap a7rm2.dap -ap-num 1
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
targets a7rm2.apb
set t0 [clock milliseconds]
set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
set f [open logs/pcverlauf_$stempel.txt w]
while {[clock milliseconds] - $t0 < 15000} {
    set t [expr {[clock milliseconds] - $t0}]
    set z [format "%6d" $t]
    foreach b {0x80110000 0x80112000 0x80114000 0x80116000} {
        if {[catch {
            set pc [lindex [a7rm2.apb read_memory [expr {$b + 0x84}] 32 1] 0]
            set ds [lindex [a7rm2.apb read_memory [expr {$b + 0x88}] 32 1] 0]
            append z [format "  %08x/%08x" $pc $ds]
        } err]} {
            append z "  --------/--------"
            catch {dap init}
        }
    }
    puts $f $z
    echo $z
    sleep 80
}
close $f
shutdown
