# =====================================================================
# Sony A7R II / ILCE-7RM2 (Plattform CXD90014) – SWD Stufe 1:
# nur Debug-Port identifizieren
# Sonde: RP2040 Zero mit debugprobe (CMSIS-DAP), GP2 = SWCLK, GP3 = SWDIO
#
# Anschluss an der Hauptplatine SY-1058, Seite A (Level-3-Handbuch,
# Schaltplan Blatt 11/35, Bestückungsplan Seite 6-54):
#   CL1100 = SWCLK (IC6000 Ball W25)  -> Sonde GP2, 100 Ohm in Reihe
#   CL1101 = SWDIO (IC6000 Ball W26)  -> Sonde GP3, 100 Ohm in Reihe
#   GND                               -> Sonde GND
#   KEIN 3V3 der Sonde an die Kamera. CL1102 (FIQ) nicht anschließen.
#
# Was diese Datei tut:
#   - verbindet sich mit dem Debug Port (DP) und liest DPIDR
#   - liest die Access-Port-Kennungen (AP0, AP1) und die ROM-Tabelle
# Was sie NICHT tut:
#   - kein "target create" -> kein Halt, kein Breakpoint, kein Reset
#   - kein Speicher- oder Registerschreibzugriff auf die CPU
# Einziger Schreibzugriff: OpenOCD setzt im DP-CTRL/STAT die
# Power-Up-Request-Bits (CDBGPWRUPREQ/CSYSPWRUPREQ). Das ist bei jedem
# SWD-Zugriff nötig und verschwindet beim Ausschalten.
#
# Vergleichswerte (A6000-Referenz; für die A7R II NICHT bewiesen):
#   DPIDR 0x3ba02477, AP0 = AHB-AP (IDR 0x44770001),
#   AP1 = APB-AP (IDR 0x24770002, BASE 0x80000000), 4x Cortex-A5
# Weicht etwas ab: nicht weitermachen, Protokoll sichern.
# =====================================================================

adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none

# Bewusst ohne -expected-id: jede gelesene DPIDR soll angezeigt werden.
swd newdap a7rm2 cpu -enable
dap create a7rm2.dap -chain-position a7rm2.cpu

# Keine GDB-/Telnet-Server für diesen Einmaltest
gdb_port disabled
tcl_port disabled
telnet_port disabled

init

echo "---- AP0 (Vergleich: AHB-AP) ----"
catch {a7rm2.dap info 0} r; echo $r
echo "---- AP1 (Vergleich: APB-AP mit ROM-Tabelle 0x80000000) ----"
catch {a7rm2.dap info 1} r; echo $r

shutdown
