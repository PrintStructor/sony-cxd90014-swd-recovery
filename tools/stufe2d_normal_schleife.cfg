# =====================================================================
# Sony A7R II – SWD Stufe 2d: Logs im NORMALMODUS (Bootschleife) lesen
# NUR LESEN. Kein Halt, kein Schreiben in Speicher oder CPU.
#
# Idee: Die Kamera startet etwa alle 6,3 s neu. Diese Schleife liest
# etwa 45 s lang immer wieder den Kopf des klog-Puffers (0x834e0000:
# "klog", Länge) und speichert jedes Mal den beschriebenen Teil.
# Bricht die Verbindung beim Neustart ab, wird der DAP neu initialisiert.
# Danach liegt von jedem Startvorgang der längste Stand vor, also die
# letzten Meldungen kurz vor dem Neustart.
# Zusätzlich: Trailer der alog-Puffer log_main/log_events (je 32 Byte).
# 1 MHz wurde am 15.11. im Werksmodus geprüft (bitgleich zu 100 kHz).
# =====================================================================
adapter driver cmsis-dap
adapter speed 1000
transport select swd
reset_config none
swd newdap a7rm2 cpu -enable
dap create a7rm2.dap -chain-position a7rm2.cpu
target create a7rm2.ahb mem_ap -dap a7rm2.dap -ap-num 0
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
targets a7rm2.ahb

set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
file mkdir logs/schleife_$stempel
set t0 [clock milliseconds]
set i 0
set fehler 0
while {[clock milliseconds] - $t0 < 45000} {
    incr i
    set t [expr {[clock milliseconds] - $t0}]
    if {[catch {
        set kopf [a7rm2.ahb read_memory 0x834e0000 32 2]
        set magic [lindex $kopf 0]
        set len   [expr {[lindex $kopf 1]}]
        if {$magic == 0x676f6c6b && $len > 0 && $len <= 0x1fff8} {
            set n [expr {($len + 8 + 3) & ~3}]
            dump_image [format "logs/schleife_%s/klog_%04d_t%05d_len%06d.bin" $stempel $i $t $len] 0x834e0000 $n
            echo [format "%6d ms  #%d  klog len %d" $t $i $len]
        } else {
            echo [format "%6d ms  #%d  klog-Kopf ungültig: %08x %08x" $t $i $magic $len]
        }
        set tr1 [a7rm2.ahb read_memory 0x8349ffc0 32 8]
        set tr2 [a7rm2.ahb read_memory 0x834bffe0 32 8]
        set f [open logs/schleife_$stempel/alog_trailer.txt a]
        puts $f "$t $i main: $tr1 events: $tr2"
        close $f
    } err]} {
        incr fehler
        echo [format "%6d ms  #%d  Lesefehler: %s" $t $i $err]
        catch {dap init}
        sleep 200
    }
    sleep 150
}
echo [format "Fertig: %d Durchläufe, %d Lesefehler. Ordner logs/schleife_%s" $i $fehler $stempel]
shutdown
