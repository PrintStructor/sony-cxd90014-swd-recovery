# Sony A7R II – SWD Stufe 2c: persistente Logpuffer lesen (NUR LESEN)
# Adressen aus dem Kernel-Log (Stufe 2b, Werksmodus, 15.11.2026):
#   klog: 0x00020000 @ 0x834e0000 (Kernel-Logkopie, mit Magic, übersteht Warmstart)
#   alog: 0x8345ffc0, log_main 256K, log_events 128K (+ log_radio 64K)
# Kein Halt, kein Schreiben.
adapter driver cmsis-dap
adapter speed 1000
transport select swd
reset_config none
swd newdap a7rm2 cpu -enable
dap create a7rm2.dap -chain-position a7rm2.cpu
target create a7rm2.ahb mem_ap -dap a7rm2.dap -ap-num 0
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
targets a7rm2.ahb
set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
echo "klog-Kopf:"
catch {mdw 0x834e0000 8} r; echo $r
catch {dump_image logs/klog_$stempel.bin 0x834e0000 0x20000} r; echo $r
echo "alog log_main-Kopf:"
catch {mdw 0x8345ffc0 8} r; echo $r
catch {dump_image logs/alog_main_$stempel.bin 0x8345ffc0 0x40020} r; echo $r
echo "alog log_events:"
catch {dump_image logs/alog_events_$stempel.bin 0x8349ffe0 0x20020} r; echo $r
shutdown
