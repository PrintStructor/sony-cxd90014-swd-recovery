# =====================================================================
# Sony A7R II – SWD Stufe 2b: Kernel-Log aus dem RAM lesen (NUR LESEN)
# Voraussetzung: Stufe 1 und 2 erfolgreich (DPIDR 0x3ba02477).
#
# Herleitung (offline aus FW 4.01, nflasha3/vmlinux.bin, Kernel 3.0.27):
#   vmlinux.bin beginnt bei VA 0x40038000 (PAGE_OFFSET 0x40000000,
#   TEXT_OFFSET 0x38000). Kopf: e321f0d3 eb005a0d.
#   emit_log_char (0x4006190c) nutzt:
#     0x403ed8c0 = log_buf_len, 0x403ed8c4 = log_buf (Zeiger)
#     0x4041fad0 = log_end, +4 log_start, +8 con_start, +c logged_chars
#   Startwerte im Image: log_buf_len 0x2000, log_buf 0x4041ff9d.
# Die physische Basis (PHYS_OFFSET) setzt der Loader3 zur Laufzeit aus
# \boot\loadaddr.txt. Deshalb werden hier Kandidaten nur GELESEN und
# mit dem Kernel-Kopf verglichen. Ein Lesefehler an einer Adresse ohne
# Speicher ist harmlos (AP-Fehlerbit, OpenOCD setzt es zurück).
# Kein Halt, kein Schreiben in Speicher oder CPU-Register.
# Hinweis: AHB-AP liest am CPU-Cache vorbei; die jüngsten Logzeilen
# können noch im Cache stehen und hier fehlen oder veraltet sein.
# =====================================================================

adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none

swd newdap a7rm2 cpu -enable
dap create a7rm2.dap -chain-position a7rm2.cpu
target create a7rm2.ahb mem_ap -dap a7rm2.dap -ap-num 0

gdb_port disabled
tcl_port disabled
telnet_port disabled

init
targets a7rm2.ahb

proc rd32 {a} {
    set v [a7rm2.ahb read_memory $a 32 1]
    return [expr {[lindex $v 0]}]
}

set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
set phys -1
foreach c {0x80000000 0x00000000 0x40000000 0x10000000 0x20000000 0x60000000 0x88000000 0xa0000000 0xc0000000} {
    if {[catch {set w0 [rd32 [expr {$c + 0x38000}]]; set w1 [rd32 [expr {$c + 0x38004}]]} err]} {
        echo [format "PHYS-Kandidat 0x%08x: Lesefehler (%s)" $c $err]
        continue
    }
    echo [format "PHYS-Kandidat 0x%08x: %08x %08x" $c $w0 $w1]
    if {$w0 == 0xe321f0d3 && $w1 == 0xeb005a0d} { set phys $c; break }
}

if {$phys < 0} {
    echo "Kernel-Kopf an keinem Kandidaten gefunden. Nichts weiter gelesen."
} else {
    echo [format ">>> Kernel gefunden: PHYS_OFFSET = 0x%08x" $phys]
    proc v2p {va} { global phys; return [expr {$va - 0x40000000 + $phys}] }
    set len  [rd32 [v2p 0x403ed8c0]]
    set buf  [rd32 [v2p 0x403ed8c4]]
    set lend [rd32 [v2p 0x4041fad0]]
    set lsta [rd32 [v2p 0x4041fad4]]
    set csta [rd32 [v2p 0x4041fad8]]
    set lchr [rd32 [v2p 0x4041fadc]]
    echo [format "log_buf_len 0x%x  log_buf 0x%08x  log_end %u  log_start %u  con_start %u  logged_chars %u" $len $buf $lend $lsta $csta $lchr]
    set f [open "logs/kernel_log_meta_$stempel.txt" w]
    puts $f [format "phys 0x%08x\nlen 0x%x\nbuf 0x%08x\nlog_end %u\nlog_start %u\ncon_start %u\nlogged_chars %u" $phys $len $buf $lend $lsta $csta $lchr]
    close $f
    if {$len > 0 && $len <= 0x100000 && $buf >= 0x40000000 && $buf < 0x80000000} {
        catch {dump_image logs/kernel_log_$stempel.bin [v2p $buf] $len} r; echo $r
    } else {
        echo "log_buf-Werte unplausibel, kein Dump."
    }
}
shutdown
