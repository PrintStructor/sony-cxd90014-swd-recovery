# Sony A7R II – SWD Stufe 2f: alog-Puffer stückweise lesen (NUR LESEN)
# Die Bootschleife setzt die Kamera alle ~6 s zurück. Deshalb Stücke zu
# 16 KB (~0,4 s bei 1 MHz) mit bis zu 15 Wiederholungen je Stück.
adapter driver cmsis-dap
adapter speed 1000
transport select swd
reset_config none
swd newdap a7rm2 cpu -enable
dap create a7rm2.dap -chain-position a7rm2.cpu
target create a7rm2.ahb mem_ap -dap a7rm2.dap -ap-num 0
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
targets a7rm2.ahb
set stempel [clock format [clock seconds] -format %Y%m%d_%H%M%S]
set ordner logs/alog_$stempel
file mkdir $ordner
proc stuecke {name basis groesse} {
    global ordner
    set n [expr {$groesse / 0x4000}]
    for {set k 0} {$k < $n} {incr k} {
        set a [expr {$basis + $k * 0x4000}]
        set ok 0
        for {set v 1} {$v <= 15 && !$ok} {incr v} {
            if {[catch {dump_image [format "%s/%s_%02d.bin" $ordner $name $k] $a 0x4000} err]} {
                catch {dap init}
                sleep 300
            } else { set ok 1 }
        }
        echo [format "%s Stück %2d (0x%08x): %s nach %d Versuch(en)" $name $k $a [expr {$ok ? "OK" : "FEHLT"}] [expr {$v - 1}]]
    }
}
stuecke main   0x8345ffc0 0x40000
stuecke events 0x8349ffe0 0x20000
catch {a7rm2.ahb read_memory 0x8349ffc0 32 8} r; echo "Trailer main:   $r"
catch {a7rm2.ahb read_memory 0x834bffe0 32 8} r; echo "Trailer events: $r"
echo "Ordner: $ordner"
shutdown
