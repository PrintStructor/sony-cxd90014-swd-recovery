# =====================================================================
# Sony A7R II / ILCE-7RM2 (Plattform CXD90014) – SWD Stufe 2:
# nur lesender Speicherzugriff
# Erst ausführen, wenn Stufe 1 eine plausible DPIDR und AP0/AP1 zeigt
# UND die ROM-Tabelle aus Stufe 1 die Debugbasis 0x80110000 für Kern 0
# bestätigt. Steht dort eine andere Adresse: diese Datei vorher anpassen.
#
# Liest über AP0 (AHB-AP, physischer Speicher) mit einem "mem_ap"-Target.
# Ein mem_ap-Target hat keine CPU-Steuerung: kein Halt, kein Schritt.
# Über AP1 (APB-AP) werden nur Kennungs- und Statusregister von Kern 0
# gelesen, keine Schreibzugriffe (kein Entsperren über DBGLAR).
#
# WICHTIG: Für die A7R II gibt es KEINE bekannten Sollwerte. Der
# Loader3 steckt nicht im Firmware-Paket. Diese Stufe sammelt nur Daten:
#   logs/bootrom_a7rm2.bin      BootROM 0xffff0000, 24 KB
#   logs/loader3_ram_a7rm2.bin  RAM-Bereich 0xc01f0000, 0x21000 Bytes
# Die A5000-Werte unten sind reine Vergleichsanzeige. Stimmen sie nicht,
# ist das kein Fehler, sondern der Befund "anderer Loader".
# Im Werksmodus (56k) läuft Linux; der Loader3-Bereich im RAM kann dann
# schon überschrieben sein.
# =====================================================================

adapter driver cmsis-dap
adapter speed 100
transport select swd
reset_config none

swd newdap a7rm2 cpu -enable
dap create a7rm2.dap -chain-position a7rm2.cpu

target create a7rm2.ahb mem_ap -dap a7rm2.dap -ap-num 0
target create a7rm2.apb mem_ap -dap a7rm2.dap -ap-num 1

gdb_port disabled
tcl_port disabled
telnet_port disabled

init

# --- 1) Kern-0-Debugregister (nur lesen) ----------------------------
targets a7rm2.apb
echo "DBGDIDR  Kern 0 (0x80110000):"
catch {mdw 0x80110000} r; echo $r
echo "DBGDSCR  Kern 0 (0x80110088, externe Sicht, ohne Nebenwirkung):"
catch {mdw 0x80110088} r; echo $r
echo "MIDR/CPUID Kern 0 (0x80110d00, A5000/A6000: 0x410fc05x = Cortex-A5):"
catch {mdw 0x80110d00} r; echo $r
echo "PC-Stichproben Kern 0 (DBGPCSR 0x80110084), 8x:"
for {set i 0} {$i < 8} {incr i} { catch {mdw 0x80110084} r; echo $r ; sleep 50 }

# --- 2) BootROM lesen ------------------------------------------------
targets a7rm2.ahb
echo "BootROM-Kopf 0xffff0000:"
catch {mdw 0xffff0000 8} r; echo $r
catch {dump_image logs/bootrom_a7rm2.bin 0xffff0000 0x6000} r; echo $r

# --- 3) Loader3-Bereich lesen (Adresse von A5000/A6000 übernommen) ---
# Nur zum Vergleich, A5000-Spender (FW 1.10):
#   0xc01f0000: ea000008 ea000005 ea000004 ea000003 ...
#   0xc01f15b0: a1f8a2f5 f8a8f002 a0fae004 fff9f002 da012800 bd102000 bd102001 b50848dd
#   0xc01f1e10: fbc3f7ff 2003b108 f7ffe188 2405ffa6 ...
echo "RAM 0xc01f0000 (A5000: Loader3-Einstieg):"
catch {mdw 0xc01f0000 8} r; echo $r
echo "RAM 0xc01f15b0 (A5000: Updater-Prüfung):"
catch {mdw 0xc01f15b0 8} r; echo $r
echo "RAM 0xc01f1e10 (A5000: BootMode-Auswahl):"
catch {mdw 0xc01f1e10 8} r; echo $r
catch {dump_image logs/loader3_ram_a7rm2.bin 0xc01f0000 0x21000} r; echo $r

shutdown
